# SwiftLint configuration for Moonlight iOS

included:
  - Shared
  - Moonlight Vision

excluded:
  - Shared/Networking/XML/Clibxml2

# Use default rules + selected opt-in rules
opt_in_rules:
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - last_where
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_in_static_references
  - prefer_zero_over_explicit_init
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces

line_length:
  warning: 140
  error: 200

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 60
  error: 100

cyclomatic_complexity:
  warning: 15
  error: 25

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 60
    error: 80
  excluded:
    - id
    - ip
    - i
    - j
    - x
    - y
    # C callback functions from moonlight-common-c
    - ArInit
    - ArCleanup
    - ArDecodeAndPlaySample

type_name:
  excluded:
    # Internal decoder type using Swift underscore convention
    - _XMLDecoder
    # Xcode-generated app entry point
    - Moonlight_VisionApp

nesting:
  type_level: 2
  function_level: 3

large_tuple:
  warning: 3
  error: 4
